spring.application.name=book-api

# MySQL connection (override with environment variables if needed)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:bookuser}
spring.datasource.password=${DB_PASSWORD:BookPass@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
